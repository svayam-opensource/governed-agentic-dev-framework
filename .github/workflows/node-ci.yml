name: node-ci

# Build + lint + test the Node/TypeScript packages under ts/* on Node 24 (AD-6.1).
# These are the in-flight Bash → Node migration of prj-work (PRJ-43, issue #91):
# during the transition they live alongside the legacy bash CLI and get their own
# real push/PR green. The bash lint/bats/e2e workflows stay for the bash CLI at the
# repo root. Path-filtered so pure-bash changes don't spin this up.

on:
  # PRs: NO path filter — so `gov-work` always runs + reports, letting it be a
  # REQUIRED status check (a path-filtered required check blocks PRs that don't
  # touch the paths, since the check never runs). The build is cached + fast when
  # nothing changed.
  pull_request:
  # Pushes: the LONG-LIVED branches only. A branch with an open PR is already
  # covered by the `pull_request` event, and firing on both ran EVERY job twice
  # per commit — see the concurrency note below.
  push:
    branches: [main, dev]
    paths:
      - "publish/actions/ts/**"
      - "publish/libs/gov-core/**"
      - ".github/workflows/node-ci.yml"

# ONE RUN PER COMMIT. Keyed on the HEAD REF, not `github.ref`: for a push that is
# `refs/heads/<branch>` and for a pull_request it is `refs/pull/<n>/merge`, so a ref-keyed
# group put the two events in DIFFERENT groups and neither cancelled the other. Every commit
# on a PR branch therefore ran this workflow twice, and adopter-e2e twice — four runs, ~7 jobs,
# half of them exact duplicates. On 2026-08-07 two `gov-work` jobs then sat 16 minutes and died
# with "The job was not acquired by Runner of type hosted" while `gov-core` passed in 16s on the
# same workflow. `head_ref` is set for a pull_request and empty for a push, so the fallback to
# `ref_name` keeps main/dev pushes in their own group.
concurrency:
  group: node-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test:
    name: gov-work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: publish/actions/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: publish/actions/ts/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # MANDATORY full-flow e2e gate (PRJ-43): the hermetic seed→task→merge e2e
      # must pass before a PR merges (and thus before publish). It's already part
      # of `npm test`; this named step makes it a visible, required check. The
      # REAL-GitHub e2e (TESTBED-DESIGN §3, Tier B) is a separate MANUAL
      # pre-publish gate (needs a sandbox org + bot PAT), not run per-PR.
      - name: e2e (full-flow gate — required before merge/publish)
        run: npm run test:e2e

  gov-core:
    # The shared identity/creds/context library the three gov clients agree through. It has no runtime
    # dependencies and no client imports it yet — it is built and tested on its own so that the day a client
    # DOES depend on it, the dependency is already known-green.
    name: gov-core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: publish/libs/gov-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: publish/libs/gov-core/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
