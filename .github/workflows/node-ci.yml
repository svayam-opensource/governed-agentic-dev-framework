name: node-ci

# Build + lint + test the Node/TypeScript packages on Node 24 (AD-6.1), ON EVERY PLATFORM WE SHIP TO.
#
# These are CLIs and a library that adopters install on their own machines — so "it passes on
# ubuntu-latest" was never the claim we needed. Until 2026-08-07 that was the only claim we had: all
# four jobs ran on ubuntu and nothing else, while `gov-work` targets Windows users through Git Bash
# and macOS developers daily. A platform we have never executed on is unproven, not proven-good.
#
#   hosted    ubuntu · macOS · Windows   (free for public repositories)
#   container Debian · Fedora            (on the ubuntu host — glibc/toolchain differences, also free)

on:
  # PRs: NO path filter — so the required checks always run + report (a path-filtered required check
  # blocks PRs that don't touch the paths, since the check never runs). Cached + fast when unchanged.
  pull_request:
  # Pushes: the LONG-LIVED branches only. A branch with an open PR is already covered by the
  # `pull_request` event, and firing on both ran EVERY job twice per commit — see the concurrency note.
  push:
    branches: [main, dev]
    paths:
      - "publish/actions/ts/**"
      - ".github/workflows/node-ci.yml"
      # The `generated` job below checks files rendered FROM these, so a push that changes only the
      # protocol, a policy's cue blocks or the shipped content must still run this workflow. Leaving
      # them out is how "the check is wired into CI" would have been true and still caught nothing.
      - "agent/**"
      - "publish/content/**"
      - "package.json"
      - "package-lock.json"

# ONE RUN PER COMMIT. Keyed on the HEAD REF, not `github.ref`: for a push that is
# `refs/heads/<branch>` and for a pull_request it is `refs/pull/<n>/merge`, so a ref-keyed
# group put the two events in DIFFERENT groups and neither cancelled the other. Every commit
# on a PR branch therefore ran this workflow twice, and adopter-e2e twice — four runs, half of
# them exact duplicates. That waste matters more now that each run is a 5-platform matrix.
# `head_ref` is set for a pull_request and empty for a push, so the fallback to `ref_name`
# keeps main/dev pushes in their own group.
concurrency:
  group: node-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── the GENERATED files still match their sources ────────────────────────────────────────────────
  #
  # THREE CHECKS THAT EXISTED AND WERE CALLED BY NOTHING (PRJ-121, 2026-09-28). `render-harness --check`
  # was implemented, documented, and invoked by no workflow, no test and no hook — so editing
  # `agent/session-protocol.md` or a policy's `gov:cue` block and forgetting to re-render passed every gate
  # this repository has. The nine harness files are the ONLY thing that puts governance in an agent's
  # context; a stale one is an agent obeying a protocol nobody ratified, and it fails the way every defect
  # in this area fails, which is silently. `docs:cli:check` is the same shape for the CLI reference.
  #
  # HERE, NOT A THIRD WORKFLOW. `catalog-freshness.yml` is deliberately a weekly SCHEDULE — it queries npm,
  # and a registry hiccup must not redden a pull request. These two are offline byte comparisons and belong
  # on the PR, so they join the workflow that already gates merges. Nothing existing is touched.
  #
  # ONE OS: the inputs are files in the repository and the comparison is bytes. A five-platform matrix would
  # assert the same equality five times. Line endings are handled by `.gitattributes`, and the cross-OS
  # suites under `test/cross-os` are where that belongs.
  generated:
    name: generated files match their sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: publish/actions/ts/package-lock.json
      # BOTH manifests. `render-harness.mjs` lives at the repo root (js-yaml + tsx) and imports the renderer
      # out of `publish/actions/ts/src`, which is the whole point of it being a thin wrapper: the publisher
      # runs the same code an adopter's `gov rules build` runs, so the two cannot drift.
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: publish/actions/ts

      # Fails with the exact file list and the command to run. Locally: `npm run render-harness` from the
      # repository root, then commit what it wrote.
      - name: the nine harness files match the protocol + the policies' cue blocks
        run: npm run render-harness:check

      # Locally: `npm run docs:cli` in publish/actions/ts.
      - name: the generated CLI reference matches the specs
        working-directory: publish/actions/ts
        run: npm run docs:cli:check

      # ADVISORY BY CONSTRUCTION, and kept advisory here. This one asks the VENDORS — it downloads each
      # agent's published package and looks for the context filename the catalog claims it reads — so it
      # needs the network and exits 0 whatever it finds: a vendor renaming a file between releases is news,
      # not a broken pull request. It runs weekly in `catalog-freshness.yml` as well; that is the run that
      # matters. It is here so a change to the harness path list gets the vendor's answer in the same place
      # the two gates above are read, and `continue-on-error` says out loud that it cannot fail the build —
      # so nobody later mistakes a green tick here for a verified path.
      #
      # Locally: `npm run harness:freshness` in publish/actions/ts.
      - name: (advisory) each vendor's package still ships the path gov writes for it
        working-directory: publish/actions/ts
        continue-on-error: true
        run: npm run harness:freshness

  # ── the CLI, on every hosted OS an adopter runs it on ─────────────────────────────────────────────
  gov-work:
    name: gov-work (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # fail-fast OFF: when Windows breaks we want to know whether macOS did too. A cancelled sibling
      # tells us nothing, and "unknown" is the state this matrix exists to remove.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux, lint: true }
          - { os: macos-latest, label: macos, lint: false }
          - { os: windows-latest, label: windows, lint: false }
    defaults:
      run:
        working-directory: publish/actions/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: publish/actions/ts/package-lock.json
      # npm runs a script through cmd.exe on Windows, and our scripts use POSIX shape —
      # `NODE_OPTIONS='…' mocha 'glob'` — which cmd cannot parse. Git Bash ships on the runner, so
      # point npm at it. NOT a workaround to hide a defect: it is exactly what a Windows adopter does
      # (the framework already documents Git Bash as the Windows shell), and it makes the failures
      # this matrix reports be about OUR CODE rather than about argument quoting.
      - name: use Git Bash for npm scripts (Windows)
        if: runner.os == 'Windows'
        run: npm config set script-shell bash
      - run: npm ci
      - run: npm run build
      # lint is platform-independent — one run is the signal, three is noise.
      - if: matrix.lint
        run: npm run lint
      - run: npm test
      # MANDATORY full-flow e2e gate (PRJ-43): the hermetic seed→task→merge e2e must pass before a PR
      # merges (and thus before publish). It is already part of `npm test`; this named step makes it a
      # visible, required check. The REAL-GitHub e2e (TESTBED-DESIGN §3, Tier B) is a separate MANUAL
      # pre-publish gate (needs a sandbox org + bot PAT), not run per-PR.
      - name: e2e (full-flow gate — required before merge/publish)
        run: npm run test:e2e

  # ── the BOOTSTRAP installer, on a machine that has nothing ───────────────────────────────────────
  # The job above tests the CLI once Node exists. This one tests the step before that: the installer
  # an adopter runs on a machine with no Node at all (#186). It is the only way we test install.ps1 —
  # Docker on a Mac or Linux host cannot run Windows containers, and pwsh on Linux has none of the
  # three things the Windows path is made of (LOCALAPPDATA, PROCESSOR_ARCHITECTURE, a user-scoped
  # PATH). A hosted Windows runner is the test bed, not a nicety.
  #
  # setup-node is deliberately absent, and the runner's own Node is stripped from PATH: the installer
  # must find, download and unpack its own, exactly as it will on a laptop.
  #
  # Written as per-OS steps rather than one step with an expression, so a reader can see both paths.
  bootstrap:
    name: bootstrap installer (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: macos-latest, label: macos }
          - { os: windows-latest, label: windows }
    steps:
      - uses: actions/checkout@v4

      # Cheap, and catches the mistake install.sh has made three times: a function
      # called above its own definition. `bash -n` cannot see it — bash resolves the
      # name when the call runs — so the failure only shows up on someone's laptop.
      - name: every shell function is defined before it is called
        if: runner.os == 'Linux'
        run: ./ci/check-install-sh.sh

      # ── POSIX ────────────────────────────────────────────────────────────────
      # Stripping PATH by directory NAME is not enough: the hosted runners also expose
      # node through /usr/local/bin, whose name says nothing about node. A job that
      # quietly keeps its Node tests the SKIP path and reports it as the cold path —
      # 8 seconds, all green, nothing downloaded. So: strip, then ASSERT.
      - name: hide the runner's preinstalled Node
        if: runner.os != 'Windows'
        run: |
          clean=$(echo "$PATH" | tr ':' '\n' | grep -vE 'node|nvm|hostedtoolcache' | paste -sd: -)
          # Anything still answering to `node` gets its directory dropped too.
          while n=$(PATH="$clean" command -v node 2>/dev/null); do
            d=$(dirname "$n")
            echo "also dropping $d (it still provides node)"
            clean=$(echo "$clean" | tr ':' '\n' | grep -vxF "$d" | paste -sd: -)
          done
          echo "PATH=$clean" >> "$GITHUB_ENV"

      - name: prove this machine has no Node
        if: runner.os != 'Windows'
        run: |
          if command -v node >/dev/null 2>&1; then
            echo "node is still on PATH at $(command -v node) — this job would test the skip path, not the cold one" >&2
            exit 1
          fi
          echo "no node on PATH: the installer has to fetch its own"

      - name: it runs on a machine with no Node
        if: runner.os != 'Windows'
        run: bash ./install.sh

      - name: and it left a working gov behind
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/share/gov/node/bin:$PATH"
          gov --version

      # Re-running must be safe and boring. A bootstrap people are afraid to run twice is a bootstrap
      # they will not run at all.
      - name: running it again changes nothing
        if: runner.os != 'Windows'
        run: bash ./install.sh

      # CI has no terminal, so a --yes that still reached `gh auth login` would hang until the job
      # timed out. Asserting it COMPLETES is the point; what it managed to fix is not.
      - name: doctor --fix --yes completes without waiting for anyone
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/share/gov/node/bin:$PATH"
          gov doctor --fix --yes || true

      # ── Windows ──────────────────────────────────────────────────────────────
      - name: hide the runner's preinstalled Node
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clean = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'node|nvm|hostedtoolcache' }) -join ';'
          "PATH=$clean" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: prove this machine has no Node
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command node -ErrorAction SilentlyContinue) {
            Write-Error "node is still on PATH — this job would test the skip path, not the cold one"
            exit 1
          }
          Write-Host "no node on PATH: the installer has to fetch its own"

      - name: it runs on a machine with no Node
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1

      - name: and it left a working gov behind
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:LOCALAPPDATA\gov\node;$env:PATH"
          gov --version

      - name: running it again changes nothing
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1

      - name: doctor --fix --yes completes without waiting for anyone
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:LOCALAPPDATA\gov\node;$env:PATH"
          gov doctor --fix --yes
          exit 0

  # ── the CLI, on the Linux distros adopters actually deploy on ────────────────────────────────────
  # `ubuntu-latest` is one Debian derivative with one glibc and one preinstalled toolchain. A bare
  # Debian and a Fedora container catch what that hides: missing tools we silently rely on, and
  # anything glibc/musl-adjacent. They run on the ubuntu host, so they cost nothing extra.
  gov-work-distro:
    name: gov-work (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: debian, image: "debian:stable-slim" }
          - { distro: fedora, image: "fedora:latest" }
    defaults:
      run:
        working-directory: publish/actions/ts
    steps:
      # A bare distro image has none of the runner's preinstalled tooling. Install ONLY what the
      # actions themselves need (checkout wants git; setup-node unpacks a .tar.xz) — deliberately not
      # a build-essential kitchen sink, so a test that needs something we do not ship FAILS here
      # instead of quietly finding it on the host.
      - name: bootstrap the container
        working-directory: /
        run: |
          set -eu
          if command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates curl xz-utils
          else
            dnf -y install git ca-certificates tar xz findutils
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: e2e (full-flow gate)
        run: npm run test:e2e

