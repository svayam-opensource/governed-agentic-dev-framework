name: test-merge gate

# Runs the workspace validators against the proposed merge state of every
# pull request targeting the default branch (main) or the publish branch.
#
# This is defense-in-depth: scripts that mutate $DEFAULT_BRANCH already call
# scripts/test-merge.sh or validate_or_revert locally before pushing. CI
# runs the same validators against GitHub's auto-generated merge commit
# (refs/pull/<n>/merge), which is what the merge would actually produce.
#
# Required dependencies are pinned to system Python; pyyaml is installed
# via pip. No external services required.

on:
  pull_request:
    branches:
      - main
      - publish
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# Cancel previous in-flight runs for the same PR when a new commit arrives.
concurrency:
  group: test-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout merge commit
        # actions/checkout uses GITHUB_SHA which, for pull_request events,
        # is the merge commit GitHub creates between PR head and base.
        # That is exactly the post-merge state we want to validate.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pyyaml
        run: pip install --quiet pyyaml

      - name: Show what we're validating
        run: |
          echo "PR:           #${{ github.event.pull_request.number }}"
          echo "Base branch:  ${{ github.base_ref }}"
          echo "Head branch:  ${{ github.head_ref }}"
          echo "Merge commit: ${{ github.sha }}"
          echo ""
          git log --oneline -3

      - name: Run validators
        # Framework files contain no placeholders in either branch (direction
        # A: org values live only in org-config.yaml; framework reads at
        # runtime). The validator's placeholder check is always-on.
        run: python3 scripts/validate/run.py

  tests:
    # Behavior tests for scripts (exec bits, prj EOF, install-deps, setup.sh
    # interactive flow, slug validation, template-origin refusal, no-yq path).
    # Catches regressions in the polish items shipped in v0.1.0.
    #
    # Runs on a matrix of ubuntu-latest AND macos-latest so the suite exercises
    # the BSD userland + the macOS-default bash 3.2 the framework promises to
    # support (PRJ-013 audit H1 / issue #59). macOS-only bugs (e.g. GNU-only
    # `sed`, finding C3) previously shipped green on the ubuntu-only leg.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pyyaml
        run: pip install --quiet pyyaml

      - name: Configure git identity (needed for tests/test_setup_*.sh which
              spawn child repos that may invoke git config)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Runner"

      - name: Run test suite
        run: bash tests/run-all.sh
