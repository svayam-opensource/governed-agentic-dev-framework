name: bats test bed

# Governance test bed (BATS) — Tier A (hermetic), P1 OS matrix:
# hosted macOS / Windows (Git Bash) / Ubuntu, plus Fedora & Slackware via
# `docker run` (checkout runs on the host so actions/* don't need node in the
# distro image). The same tests/bats/run.sh gates the npm publish (Jenkinsfile).
# See tests/TESTBED-DESIGN.md.

on:
  pull_request:
    branches: [main, publish]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: bats-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hosted:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run the governance test bed
        shell: bash
        run: bash tests/bats/run.sh

  containers:
    name: bats (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fedora base lacks git + diffutils; install both → full coverage
          # (incl. the setup E2E and the CRLF guard, which need git).
          - { name: fedora,    image: "fedora:latest",         deps: "dnf -y install git diffutils >/dev/null" }
          # Slackware base ships bash/coreutils/sed/gawk/grep/diffutils but no
          # git (its package install is fragile in CI) — the few git-dependent
          # tests skip gracefully there; everything else runs.
          - { name: slackware, image: "aclemons/slackware:15.0", deps: "true" }
    steps:
      - uses: actions/checkout@v4
      # Fetch the bats libs on the HOST (git lives here), so the container needs
      # no git/CA-certs/network — only bash + coreutils + diff. bootstrap.sh in
      # run.sh then no-ops because .libs/ is already populated (mounted in).
      - name: Fetch bats libs on the host
        run: bash tests/bats/bootstrap.sh
      - name: ${{ matrix.name }} — run the governance test bed
        run: |
          docker run --rm -v "$PWD":/w -w /w "${{ matrix.image }}" bash -lc '
            set -e
            ${{ matrix.deps }}
            bash tests/bats/run.sh
          '
