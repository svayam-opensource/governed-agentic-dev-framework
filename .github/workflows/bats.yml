name: bats test bed

# Governance test bed (BATS) — Tier A (hermetic), P1 OS matrix:
# hosted macOS / Windows (Git Bash) / Ubuntu, plus Fedora & Slackware via
# `docker run` (checkout runs on the host so actions/* don't need node in the
# distro image). The same tests/bats/run.sh gates the npm publish (Jenkinsfile).
# See tests/TESTBED-DESIGN.md.

on:
  pull_request:
    branches: [main, publish]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: bats-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hosted:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run the governance test bed
        shell: bash
        run: bash tests/bats/run.sh

  containers:
    name: bats (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:latest
            deps: dnf -y install git bash python3 diffutils tar gzip >/dev/null
          - name: slackware
            image: aclemons/slackware:15.0
            # Slackware base may be minimal — install git/python3 via slackpkg if
            # missing (mirror is preconfigured in this image).
            deps: |
              command -v git >/dev/null     || { yes | slackpkg -batch=on -default_answer=y update >/dev/null 2>&1; yes | slackpkg -batch=on -default_answer=y install git >/dev/null 2>&1; }
              command -v python3 >/dev/null  || { yes | slackpkg -batch=on -default_answer=y install python3 >/dev/null 2>&1; }
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.name }} — run the governance test bed
        run: |
          docker run --rm -v "$PWD":/w -w /w "${{ matrix.image }}" bash -lc '
            set -e
            ${{ matrix.deps }}
            git config --global --add safe.directory /w 2>/dev/null || true
            bash tests/bats/run.sh
          '
