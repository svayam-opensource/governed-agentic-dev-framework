name: lint gate

# Lints every shell script in the repo with shellcheck. A shell-script product
# with no lint gate is how the GNU-only `sed` bug (PRJ-013 audit C3) shipped to
# macOS adopters undetected; this gate is the systemic fix (finding C4, issue
# #59). Configuration lives in .shellcheckrc (correctness checks ON, style
# noise OFF). The gate starts at error severity (-S error) so it blocks on real
# bugs while warnings stay advisory; tighten as the tree is cleaned up.
#
# shellcheck-only; no external services, no gh/git auth required.

on:
  pull_request:
    branches:
      - main
      - publish
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Show shellcheck version
        run: shellcheck --version

      - name: Collect shell scripts
        id: collect
        # Gather every script the framework ships. Globs that match nothing are
        # dropped (nullglob) so a missing optional file (e.g. install.sh) is not
        # an error. Paths are NUL-safe via a newline-joined list consumed below.
        run: |
          shopt -s nullglob
          files=(
            scripts/*.sh
            framework/scripts/*.sh
            tests/*.sh
            .claude/hooks/*.sh
            .cursor/hooks/*.sh
            prj
            framework/prj
            setup.sh
            install.sh
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no shell scripts found to lint"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          printf '%s\n' "${files[@]}" > /tmp/lint-files.txt

      - name: Run shellcheck (error severity — hard fail on real bugs)
        run: |
          # -S error: block on correctness errors now; warnings stay advisory.
          # .shellcheckrc supplies disabled style codes and external-sources.
          xargs -a /tmp/lint-files.txt shellcheck -S error

      - name: Run shellcheck (warnings — advisory, non-blocking)
        if: always()
        run: |
          xargs -a /tmp/lint-files.txt shellcheck -S warning || true

  protocol:
    # Session-start protocol integrity gate (#54 Increment 1): the protocol is
    # only enforceable if it is reliably delivered. Block any PR that drops the
    # §0 mandate or lets a generated tool copy drift from the canonical protocol.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Session-start protocol integrity (#54)
        run: python3 scripts/validate/check_protocol.py .
