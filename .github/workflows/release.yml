name: release

# ONE PATH TO A PUBLISHED VERSION, and it starts with a tag.
#
# Before this, nothing in CI published gov (#235). The only publish pipeline was ci/Jenkinsfile,
# which targeted @svayam-opensource/prj — deprecated, and gating on paths that moved under
# publish/actions/deprecated/ — so every 1.x release reached npm by hand. The result was three
# version tracks that disagreed: npm at 1.2.2, the newest git tag at v0.10.0 (the pre-1.0 line), and
# the newest GitHub release at v0.3.4 from May 2026. A customer could not see what changed, pin to a
# reviewed version, or diff the tarball against its source.
#
# The tag IS the release trigger, so the tag is the thing to get right. Everything else follows from
# it: the version published, the release notes, and the provenance attestation that ties the tarball
# back to this run.
on:
  push:
    tags: ["v*"]
  # Re-running a release by hand has to be possible — a failed publish step should not need a
  # deleted-and-retagged history to retry.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.2.2)"
        required: true

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm provenance — sigstore signs using this run's OIDC identity

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false   # never cancel a publish half-done

jobs:
  release:
    name: release ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLIC_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0   # the changelog and tag history are both read below

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: publish/actions/ts/package-lock.json
          # Writes an .npmrc for the PUBLIC registry and wires NODE_AUTH_TOKEN into it. The publish
          # step ALSO passes --registry explicitly: package.json carries
          # publishConfig.registry = the internal registry (correct — that is the contributor
          # default), and the precedence between publishConfig.registry and a scoped/global .npmrc
          # entry at publish time is subtle enough that it should not be relied on. Explicit removes
          # the question.
          registry-url: https://registry.npmjs.org

      # ── THE GATE: the tag and the package must agree ─────────────────────────────────────────────
      #
      # The drift this whole workflow exists to end was exactly this disagreement, so it is checked
      # before anything is built and it is fatal. A tag that says v1.3.0 over a package.json that
      # says 1.2.2 would otherwise publish 1.2.2 and label it 1.3.0 forever.
      - name: the tag must match the package version
        working-directory: publish/actions/ts
        run: |
          pkg=$(node -p "require('./package.json').version")
          want="v${pkg}"
          echo "tag=${TAG}  package.json=${pkg}"
          if [ "$TAG" != "$want" ]; then
            echo "::error::tag ${TAG} does not match package.json ${pkg} (expected ${want}). Fix one of them; do not publish a mislabelled version."
            exit 1
          fi
          echo "VERSION=${pkg}" >> "$GITHUB_ENV"

      # A lock file that disagrees with its own package.json is what 1.2.2's release commit had to
      # fix (stale by three minor versions). Cheap to check, and it is a release-time fact.
      - name: the lock file must agree too
        working-directory: publish/actions/ts
        run: |
          lock=$(node -p "require('./package-lock.json').version")
          [ "$lock" = "$VERSION" ] || {
            echo "::error::package-lock.json is $lock but package.json is $VERSION — run npm version, which writes both."
            exit 1
          }

      # ── the same gates a PR passes, re-run against the tagged tree ───────────────────────────────
      # Not taken on trust from the PR that produced the commit: a tag can point anywhere, and what
      # gets published is this tree.
      - run: npm ci
        working-directory: publish/actions/ts
      - run: npm run build
        working-directory: publish/actions/ts
      - run: npm run lint
        working-directory: publish/actions/ts
      - run: npm test
        working-directory: publish/actions/ts
      - run: npm run test:e2e
        working-directory: publish/actions/ts
      - name: adopter smoke (hermetic)
        working-directory: publish/actions/ts
        run: npm run test:adopter:smoke

      - name: release notes from CHANGELOG.md
        run: |
          ./ci/changelog-section.sh "$VERSION" > /tmp/notes.md
          echo "--- notes ---"; cat /tmp/notes.md

      # ── publish, unless this version is already out there ────────────────────────────────────────
      #
      # npm refuses to republish a version, and the FIRST tags cut under this workflow are
      # retroactive — v1.2.2 labels a version that has been on npm since 2026-08-27. Treating that as
      # a failure would mean the new pipeline breaks the first time it is used, on purpose, which is
      # how a pipeline gets abandoned. So: already published is a SKIP with a reason, and the release
      # is still created. Anything else is a real failure.
      - name: is this version already published?
        id: published
        run: |
          if npm view "@svayam-opensource/gov@${VERSION}" version --registry "$PUBLIC_REGISTRY" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@svayam-opensource/gov@${VERSION} is already on npm — skipping publish, still creating the release."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish, with provenance
        if: steps.published.outputs.already == 'false'
        working-directory: publish/actions/ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "::error::NPM_TOKEN secret is not set — cannot publish."; exit 1; }
          # --provenance: sigstore records WHICH workflow run, at WHICH commit, built this tarball,
          # and npm serves it as a verifiable attestation. It is the missing half of #205 for the
          # client: adopters get `npm audit signatures` instead of a hash we assert about ourselves.
          # It requires a public repo (this one is) and id-token: write (granted above).
          npm publish \
            --provenance \
            --access public \
            --registry "$PUBLIC_REGISTRY" \
            --tag latest

      - name: verify what the registry now serves
        if: steps.published.outputs.already == 'false'
        run: |
          # Publishing is not the claim; being installable is. Poll briefly — the registry is not
          # instantly consistent, and a green publish followed by an unresolvable version is the
          # failure an adopter would find before we did.
          for i in 1 2 3 4 5 6; do
            if npm view "@svayam-opensource/gov@${VERSION}" version --registry "$PUBLIC_REGISTRY" >/dev/null 2>&1; then
              echo "::notice::@svayam-opensource/gov@${VERSION} resolves on the public registry."
              exit 0
            fi
            sleep 10
          done
          echo "::error::published, but @svayam-opensource/gov@${VERSION} does not resolve on ${PUBLIC_REGISTRY} yet."
          exit 1

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md
            echo "::notice::updated the existing release notes for $TAG"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "gov $VERSION" --notes-file /tmp/notes.md --verify-tag
          fi
