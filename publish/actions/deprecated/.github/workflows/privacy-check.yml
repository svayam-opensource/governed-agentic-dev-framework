name: privacy check

# Defense-in-depth privacy gate for the publish branch.
#
# Verifies that no per-org values from main's org-config.yaml have leaked
# into a PR targeting publish. Inverse of test-merge.yml's
# STRICT_PLACEHOLDERS=1 (which catches placeholders leaking into main).
#
# This workflow only runs on PRs to publish. It requires access to the
# main branch in the same repo to extract the values to check, so it is
# meaningful only in the private (source) repo — not in the public mirror.

on:
  pull_request:
    branches:
      - publish
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: privacy-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout merge commit + fetch main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history so we can git show main:...

      - name: Verify main branch is fetched
        run: |
          if ! git rev-parse --verify origin/main &>/dev/null; then
            echo "::error::main branch not accessible. Privacy check requires read access to main."
            exit 1
          fi
          # Make 'main' a local ref pointing at origin/main so check_privacy.py's
          # `git show main:org-config.yaml` works.
          git update-ref refs/heads/main origin/main
          echo "main branch ready: $(git rev-parse --short main)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pyyaml
        run: pip install --quiet pyyaml

      - name: Run privacy check
        run: python3 scripts/validate/check_privacy.py
