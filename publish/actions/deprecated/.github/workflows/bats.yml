name: bats test bed

# Governance test bed (BATS) — P1 OS matrix with environment preparation.
# Every job first PREPARES THE ENVIRONMENT with the framework's own dependency
# installer (scripts/install-deps.sh — what `prj deps` runs). That dogfoods the
# `deps` command on every OS (macOS / Windows / Ubuntu / Fedora / Slackware) AND
# guarantees the bed runs with NO skipped conditions. Then it runs the full bed,
# which also gates the npm publish (Jenkinsfile). See tests/TESTBED-DESIGN.md.

on:
  pull_request:
    branches: [main, publish]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: bats-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hosted:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prepare environment (prj deps)
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/install-deps.sh
      - name: Run the governance test bed
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash tests/bats/run.sh

  containers:
    name: bats (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fedora,    image: "fedora:latest" }
          - { name: slackware, image: "aclemons/slackware:15.0" }
    steps:
      - uses: actions/checkout@v4
      # Pre-fetch bats libs on the host so the bats clone never needs git/network
      # inside the container; install-deps.sh then prepares the rest in-container.
      - name: Fetch bats libs on the host
        run: bash tests/bats/bootstrap.sh
      - name: ${{ matrix.name }} — prepare env (prj deps) + run the bed
        run: |
          docker run --rm -v "$PWD":/w -w /w "${{ matrix.image }}" bash -lc '
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            # diff is a bats-assert runtime dep; fedora:latest ships without it.
            command -v diff >/dev/null || { command -v dnf >/dev/null && dnf -y install diffutils >/dev/null; } || true
            bash scripts/install-deps.sh
            bash tests/bats/run.sh
          '
