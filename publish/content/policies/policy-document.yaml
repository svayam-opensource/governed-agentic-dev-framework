# YOUR POLICY DOCUMENT — the title page, your chapter introductions and your glossary (policies/policy-document.yaml).
#
# gov shows your policies as one document a board committee would recognise: a title page, eight chapters, a
# glossary and an index. Each clause comes from a rule row (framework/rules/rules.yaml and policies/rules/rules.yaml);
# its `statement` is the plain-English text and its `chapter` places it. This file holds what is not a rule.
#
# The framework ships its own chapter introductions and glossary in framework/policy-document.yaml, replaced on
# every `gov upgrade`. Yours sit beside them. The framework ships this file once, and from then on it is yours —
# `gov upgrade` never rewrites it. It is POLICY: a change to it goes through a policy pull request, like any file
# under policies/.

# THE TITLE PAGE. Leave a value empty and the document leaves it out; `organization` empty means org_name.
title_page:
  title: "Development and Operations Policy"
  organization: ""
  # Who approved this edition, and when it took effect (YYYY-MM-DD).
  approved_by: ""
  approved_on: ""
  effective_from: ""
  review_cycle: "Annually"
  classification: "Internal"

# YOUR CHAPTER INTRODUCTIONS — shown after the framework's in each chapter. `number` is 1 to 8:
#   1 Purpose, scope and authority · 2 Roles and responsibilities · 3 Development · 4 Deployment and release ·
#   5 Operations and maintenance · 6 Security and access · 7 Evidence and audit · 8 Exceptions and waivers.
# `title` renames a chapter in your document. A chapter numbered 9 or above is one you add; it needs a title.
#   - { number: 3, intro: "Our engineers build only with the technologies on our approved list." }
chapters: []

# YOUR GLOSSARY — terms your own policies use. Shown with the framework's; where a term is in both, yours is shown.
#   - { term: "Release Manager", definition: "The person who decides when a release goes to production." }
glossary: []
