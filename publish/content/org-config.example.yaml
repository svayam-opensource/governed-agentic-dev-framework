# Organization configuration — who this organization is, and the infrastructure it uses.
#
# The values are yours; the list of keys and what each one means is the framework's, in
# framework/config/org-config.schema.yaml, and `gov doctor` checks this file against it.
# How the organization GOVERNS — its posture, its Policy and Check Owners, the agents it
# authorizes — is in policies/governance.yaml, where a change needs the Policy Owner.
# Re-run `gov setup` to update.

# Full legal name of your organization
org_name: ""

# Short display name (used in headings and prose)
org_short_name: ""

# Two to six capital letters naming your organization (e.g. ACME). Not FRM, which is the framework's.
org_slug: ""

# Full URL of this governance repository. 'origin' will be set to this.
org_repo_url: ""

# GitHub organization or username (derived from org_repo_url)
github_org: ""

# Name of this governance repository (derived from org_repo_url)
org_gov_repo: ""

# Default branch name for this governance repo
default_branch: "main"

# Default base branch for code repositories (used by seed)
default_code_branch: "dev"

# Where the WORK happens, when that is not where the issue lives (#194).
# A board may link an issue in a repository this org can read but not write — the
# usual shape when you work from a fork. Map upstream to your own copy and gov
# branches, pushes and merges in yours, while the board keeps linking theirs:
#
# repo_overrides:
#   genevaers/Workbench: svm-geneva/Workbench
#
# Declared, never guessed: gov will not choose where your code is pushed.

# Governance account (multi-tenant): the account this org operates under (empty = single-tenant).
gov_account: ""

# ── Service endpoints — ORG-LEVEL, GOVERNED. Set once here; adopters INHERIT (never prompted per-user).
#    Per-user secrets/tokens go to Vault via `gov-cicd creds`, NOT here. gov-work itself needs NEITHER:
#    it authenticates with your own git + gh. vault/oidc/jenkins/npm/docker are read by the deploy
#    clients (gov-cicd, gov-infra) — fill them as you adopt deploy.
services:
  vault: ""
  oidc: ""
  oidc_client_id: "gov"
  jenkins: ""
  npm: ""
  docker: ""
  # The org's GitHub App — how a code repo's checks read the governance repo (a short-lived read-only token per
  # run). Written by `gov app setup`: the App's PUBLIC identity only. Its private key is an org Actions secret
  # (GOV_APP_PRIVATE_KEY) and is never written here or anywhere else on disk.
  github_app:
    client_id: ""        # the App's client id (also the GOV_APP_CLIENT_ID org secret)
    slug: ""             # the App's slug — https://github.com/apps/<slug>

# ── Session policy. NOT a service endpoint: the block above lists URLs of things we talk to, this is a
#    number the identity provider is told to honour.
#
#    access_ttl_sec — how long an access token lives, in seconds. The org standard, declared here and
#    MINTED by the issuer from this value; the deploy compares the two and FAILS when they disagree,
#    because a lifetime that is true in a file and false in production is the shape of a failure nobody
#    finds until a token dies somewhere unrelated.
#
#    It is short on purpose. The same bearer is handed to other tools, so its life is the window in
#    which a leak is useful — everywhere. A client that needs longer is granted it NARROWLY: per client,
#    or per job. Raising this number to buy one client room is explicitly not an exception to it.
#
#    See knowledge/architecture/system/specs/token-lifetime-standard.md §3.4.
session:
  access_ttl_sec: 300
