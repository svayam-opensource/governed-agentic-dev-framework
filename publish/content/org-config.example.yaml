# Agentic Development Framework — Organization Configuration
#
# This file is shipped empty by the framework template. An adopting org runs
# gov setup once after cloning the template; that fills in real values here.
# Framework files (CLAUDE.md, AGENTS.md, knowledge/policies/, etc.) read these
# values at runtime, so this is the ONLY file that diverges from the upstream
# template after setup.
#
# Re-run gov setup to update. Do not edit by hand unless you know what you're
# doing — setup.sh overwrites the file.

# Full legal name of your organization
org_name: ""

# Short display name (used in headings and prose)
org_short_name: ""

# Uppercase slug for human display and multi-org disambiguation (2-6 chars).
# Not used in project IDs (which use a literal PRJ- prefix).
org_slug: ""

# Lowercase derivation of org_slug — used for filesystem paths under
# agent_work_root. Auto-derived from org_slug.
org_slug_lower: ""

# Full URL of this workspace repository. 'origin' will be set to this.
org_repo_url: ""

# GitHub organization or username (derived from org_repo_url)
github_org: ""

# Name of this workspace repository (derived from org_repo_url)
# The organization's governance repository — this repo. Named `workspace_repo` until 2026-09-23; gov reads
# both for one release, and `gov upgrade` adds this key with the old value.
org_gov_repo: ""

# Default branch name for this workspace repo
default_branch: "main"

# Default base branch for code repositories (used by seed script)
default_code_branch: "dev"

# The env branches BETWEEN default_branch and default_code_branch, HIGHEST FIRST.
# Leave it out and the ladder is just [default_branch, default_code_branch], which
# is right until you have a uat branch.
#
# `close` uses it to land a project branch in its base AND every branch below:
# an ordinary project is cut from `dev` and lands in `dev`; a HOTFIX is cut from a
# higher env branch and must reach that one (or production is never fixed) and every
# branch below it (or the next ordinary release silently reverts the fix).
#
#   env_branches:
#     - uat

# Per-project workspaces are created under this path. Each gets its own
# folder containing a clone of this workspace repo on the project branch
# plus clones of each impacted code repo on the project branch.
agent_work_root: ""

# Policy Owner details (initial holder of all policy roles at launch)
policy_owner_email: ""
policy_owner_github: ""
# Check Owner — the framework's second built-in role. Reviews the CODE of the
# org's check actions (policies/actions/), where the Policy Owner approves the
# rules themselves. Assigned at `gov setup` (default: the Policy Owner). Left
# empty, the role is vacant and the Policy Owner approves that code too
# (POL-034) — and `gov doctor` says so. One person holding both roles turns the
# two-key review off; doctor warns about that as well.
check_owner_github: ""

# Other role GitHub handles (update as roles are formally assigned)
legal_owner_github: ""
infra_owner_github: ""
system_arch_owner_github: ""
data_arch_owner_github: ""

# Effective date of the policy (YYYY-MM-DD)
policy_effective_date: ""

# Governance account (multi-tenant): the account this org operates under (service auth mints under it).
gov_account: ""

# HARD OR SOFT GOVERNANCE — the one posture decision, and gov implements both (Policy Owner, 2026-09-29).
#
#   hard     Install repository controls, so that work attempted OUTSIDE gov is stopped by the PLATFORM:
#            a pull request required before merging, at least one approving review, no bypass (administrators
#            included), and the approver-verifying status check as a required check. `gov repo protect plan`
#            shows what is missing; `gov repo protect apply` installs it. framework-policy §3.3 / POL-040a.
#
#   soft     Deliberately leave room for direct work — clone, commit and push by hand. A real choice, not a
#            lapse: an organization may adopt the framework for its structure, or be unable to configure the
#            platform at all (§3.4: on GitHub Free, a PRIVATE repository has no branch protection and no
#            rulesets, so NONE of the four settings can be configured there). Under soft, gov's own gates are
#            the only enforcement — and they do not bind an agent a developer starts outside gov.
#
#   unset    NOBODY HAS CHOSEN, and gov treats that as its own state rather than guessing. `gov doctor` says
#            so, and `gov repo protect apply` refuses: it will not install platform controls an organization
#            has not asked for, and it will not excuse an organization that believes it is protected.
#            Meanwhile POL-040a §3.3 is still CHECKED — not choosing is not a choice to skip it.
#
# Leave it "" until the organization has actually decided. Writing `hard` here does not configure anything on
# GitHub; `gov repo protect apply` does, and reports honestly when the platform refuses.
governance_posture: ""

# WHO MAY APPROVE — GitHub logins, for the approver check the framework ships. OPTIONAL.
#
# `policies/authorized-representatives.md` is the list §3.2 governs, and it names people by EMAIL. The
# approver-check workflow needs GitHub logins, so this is where an organization writes them. Left out, the
# workflow falls back to the *_owner_github handles above — which on day one is the Policy Owner, and correct.
#
# A code repository cannot read this file (it lives in the governance repo, and a GITHUB_TOKEN cannot read
# another private repo), so for those the same list is set as a variable — `gov repo protect` prints the
# command. Changing who approves is a human decision recorded by a pull request (POL-251, POL-253).
#
#   authorized_approvers:
#     - alice
#     - bob

# ── Service endpoints — ORG-LEVEL, GOVERNED ──────────────────────────────────────────────────────────
# The shared infrastructure this org uses. Set ONCE by the gov-admin here; adopters INHERIT these (they are
# never prompted per-user). Per-user *secrets/tokens* do NOT go here — those live in Vault via `gov creds`.
# `vault` + `oidc` are used by gov-work core (auth/creds); `jenkins`/`npm`/`docker` are read by the
# gov-cicd deploy plugin. Leave a line "" if the org doesn't use that service.
services:
  vault: ""              # OpenBao/Vault base — per-user token store + attest target (gov creds → Vault)
  oidc: ""               # IAM broker OIDC base — `gov auth login` (loopback + PKCE)
  oidc_client_id: "gov"  # the OIDC public client id for the CLI
  jenkins: ""            # org Jenkins base — a deploy triggers a job here as the user (gov-cicd)
  npm: ""                # org npm/Verdaccio registry — publish target for npm units (gov-cicd)
  docker: ""             # org container image registry — publish target for container units (gov-cicd)

# WHICH AGENTS THIS ORGANIZATION AUTHORIZES (Policy Owner, 2026-09-23).
#
# The FRAMEWORK publishes the master list of agents an org may adopt — `gov agent list` shows it, and every id
# below must come from it. The ORG records which of them are authorized here, and which gov launches when
# nobody has said otherwise. Numbered keys rather than a list, because this file is merged key by key on
# upgrade: every entry you write survives, and a value you set is never modified.
#
# `gov agent approve <id>` raises the pull request that changes it. Left empty, gov uses the framework's
# defaults and says so.
authorized_agents:
  default: ""

# WHETHER THIS ORGANIZATION PUBLISHES ITS KNOWLEDGE, and in what form (Policy Owner, 2026-09-23).
#
#   none            the default. gov's own `gov knowledge search` reads what is already on every machine.
#   site            an internal site, generated from the same markdown.
#   site+pdf        …and PDF exports for readers who need them.
#   site+pdf+rag    …and a vector store for agent retrieval.
#
# The framework ships none of that infrastructure: publishing is an add-on an org chooses, not a rule it
# breaks by default. `policies/knowledge-publication-spec.md` is the org's own record of how it does it.
knowledge_publication: "none"
