# POL → GOV ALIASES (rule-model-design.md Q21; W3, 2026-10-06).
#
# Every POL number ever allocated or cited, and what became of it under the rule model. POL numbers are
# retired: nothing new may cite one (test/content/pol-citations.test.ts). History is not rewritten, so an old
# commit, review or knowledge file that cites POL-xxx resolves here — `gov rules show POL-xxx`.
#
# Each entry is exactly one of:
#   POL-xxx: GOV-…                    the rule survives under this id
#   POL-xxx: { gov: GOV-…, also: […] } it survives, split across several rows
#   POL-xxx: { folded: GOV-… }        it was part of (or restated) that row, and lives there now
#   POL-xxx: { dropped: <reason> }    no rule carries it
#   POL-xxx: { org: pending — … }     an organization's clause; its GOV id is issued at its first propose
#
# A dotted label (POL-040a.3) resolves through its base number.

