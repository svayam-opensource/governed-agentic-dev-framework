- id: GOV-FRM-040
  source: { doc: framework/docs/specs/framework-specification.md, section: "7.1", sha: "f2202b6" }
  expectation: "Everyone lands every change to code, knowledge or policy through a pull request approved by someone with the authority to approve it."
  actor: [everyone]
  level: C01
  cue: { tier: resident, text: "YOU DO NOT APPROVE YOUR OWN WORK, and nothing merges without a review. Every change lands by a pull request someone authorized approves; land task branches with gov merge." }
