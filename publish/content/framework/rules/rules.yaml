# THE FRAMEWORK'S RULES — one row per rule revision (rule-model-design.md Q5, Q8–Q11, Q19, Q20; W2, 2026-10-06).
#
# Written only by `gov upgrade`. An organization never edits this file: it ADDS its own, stricter rules in
# `policies/rules.yaml` (W2-Q2). Every row's `source` is a section of framework-specification.md and the sha of
# that section's text (clauseSha); test/content/framework-rules.test.ts fails when the two drift.
#
# Framework rules are C01 or C03 only (W2-Q1). A `gov-client` row is a promise others rely on, checked by a test
# titled with its id (Q3/Q4). Ids 457 and 458 were proposed in the W2 classification and withdrawn by W2-Q3
# before release; 452 likewise (now GOV-FRM-040). None was ever issued.
#
# Which POL numbers each row replaced, folded or dropped: pol-aliases.yaml (`gov rules show POL-xxx`).

