# THE FRAMEWORK'S PART OF THE POLICY DOCUMENT — its chapter titles, introductions and glossary.
#
# Written only by `gov upgrade`: replaced on every upgrade, never edited by an organization. The organization's own
# title page, chapter introductions and glossary are in policies/policy-document.yaml, which gov never rewrites.
#
# The eight chapters are the seeded ones (F127 I3). `id` is the chapter number as text; a rule row's `chapter` (1 to 8)
# places its clause in one.
chapters:
  - { id: "1", title: "Purpose, scope and authority", intro: "" }
  - { id: "2", title: "Roles and responsibilities", intro: "" }
  - { id: "3", title: "Development", intro: "" }
  - { id: "4", title: "Deployment and release", intro: "" }
  - { id: "5", title: "Operations and maintenance", intro: "" }
  - { id: "6", title: "Security and access", intro: "" }
  - { id: "7", title: "Evidence and audit", intro: "" }
  - { id: "8", title: "Exceptions and waivers", intro: "" }

# Terms the framework's clauses use, each with a definition a non-technical reader can follow.
glossary: []
