  <path d="M372,234 L372,276 L725,276 L725,436" fill="none" stroke="#1f4fd6" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="408" y="270" fill="#1f4fd6" font-size="11" font-weight="bold">clone per project → PRJ_GOV</text>

  <path d="M874,228 L904,458" fill="none" stroke="#1f4fd6" stroke-width="2.2" marker-end="url(#ah)"/>
  <path d="M990,228 L1036,458" fill="none" stroke="#1f4fd6" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="905" y="250" fill="#1f4fd6" font-size="11" font-weight="bold">clone per repo → PRJ_CODE</text>
