  <text x="140" y="205" transform="rotate(-90 140 205)" text-anchor="middle" fill="#888" font-size="11" font-weight="bold">Layer 2 · GitHub: &lt;github_owner&gt;</text>
  <text x="140" y="435" transform="rotate(-90 140 435)" text-anchor="middle" fill="#888" font-size="11" font-weight="bold">Layer 3 · Local: developer machine</text>

