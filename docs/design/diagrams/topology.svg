  <text x="965" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#666">PRJ_CODE</text>
  <rect x="830" y="438" width="280" height="92" rx="6" fill="#f6f6f6" stroke="#cccccc"/>
  <rect x="845" y="460" width="118" height="55" rx="6" fill="#e6efff" stroke="#9bb6ee"/>
  <text x="904" y="483" text-anchor="middle" font-size="10" font-weight="bold">/repo1</text>
  <text x="904" y="498" text-anchor="middle" font-size="9" fill="#666">(prj_brnch)</text>
  <rect x="977" y="460" width="118" height="55" rx="6" fill="#e6efff" stroke="#9bb6ee"/>
  <text x="1036" y="483" text-anchor="middle" font-size="10" font-weight="bold">/repo2</text>
  <text x="1036" y="498" text-anchor="middle" font-size="9" fill="#666">(prj_brnch)</text>

  <!-- Provenance arrows -->
  <path d="M340,96 L340,176" fill="none" stroke="#1f4fd6" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="348" y="140" fill="#1f4fd6" font-size="11" font-weight="bold">use this template</text>

  <path d="M318,234 L318,374 L505,374 L505,393" fill="none" stroke="#1f4fd6" stroke-width="2.2" marker-end="url(#ah)"/>
