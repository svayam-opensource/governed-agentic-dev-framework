# {{ORG_NAME}} — project.yaml Template
# This file is the project manifest. Copy to: {{WORKSPACE_REPO}}/projects/{{ORG_SLUG}}-NNN-slug/project.yaml
# Generated by the seed script. Do not manually edit: id, slug, seeded_by, or base_branch.

# --- Identity ---
id: {{ORG_SLUG}}-NNN-slug              # unique project identifier — issued by seed script (POL-041)
slug: short-slug              # derived from GitHub Project name at seed time
description: ~                # one-line project intent

# --- GitHub ---
github_project: ~             # URL to the GitHub Project
github_project_name: ~        # human-readable name of the GitHub Project

# --- Assignment (POL-046) ---
assigned_to: ~                # individual email OR team-id — set at seeding, immutable
seeded_by: ~                  # individual who ran the seed script (audit record)

# --- Lifecycle (POL-048) ---
status: proposed              # proposed | active | paused | completed | cancelled
created_at: ~                 # YYYY-MM-DD — date seed script ran
started_at: ~                 # YYYY-MM-DD — date status moved to active
completed_at: ~               # YYYY-MM-DD — date status moved to completed
paused_at: ~                  # YYYY-MM-DD — date of most recent pause (cleared on resume)
cancelled_at: ~               # YYYY-MM-DD — date cancelled
cancellation_reason: ~        # required if cancelled

# --- Reassignment (C02 exception only — POL-053) ---
reassignment_reason: ~
reassigned_at: ~
reassigned_approved_by: ~

# --- Repositories ---
# {{WORKSPACE_REPO}} is always an implicit participant — do NOT list it here (POL-063)
repos:
  - url: ~                    # full GitHub repo URL
    role: primary             # primary | dependency | read-only
    base_branch: dev          # branch {{org_slug}}-NNN-slug was created from; merge-back target (POL-068)
    added_at: ~               # YYYY-MM-DD
    added_reason: ~           # populated only for repos added post-seed via add-repo script

# --- Tasks (tasks-on-board model — POL-074) ---
# Tasks are NOT tracked in this file. Each task = a GitHub Issue on the project
# board + a sub-branch ({{org_slug}}-NNN-slug/<task-slug>). The board's open vs
# Done state is the source of truth; create with `prj task`, land with `prj merge`.

# --- Knowledge Close (POL-101) ---
knowledge_status: ~           # pending_review | merged | rejected | under_revision | abandoned
knowledge_pr: ~               # URL to the knowledge close PR

# --- Agent Configuration (POL-140) ---
agent_config:
  model: auto                 # model name or 'auto'
  provider: cursor            # LLM provider — must be on approved list in llm-governance.md
